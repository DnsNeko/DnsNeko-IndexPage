<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DnsNeko domain guide page">
  <title>DnsNeko</title>
  <link rel="preload" href="fonts/MaoKenZhuYuanTi-MaokenZhuyuanTi-2.ttf" as="font" type="font/ttf" crossorigin>
<link rel="apple-touch-icon" href="favicon.ico">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <img src="img/background.jpg" alt="" class="bg__image">
    <div class="bg__blur"></div>
    <div class="bg__overlay"></div>
  </div>

  <div class="page">
    <header class="header">
      <a target="_blank" href="https://dnsneko.com" class="brand" rel="noopener noreferrer">
        <svg class="brand__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2C8.5 2 6 4.5 6 8c0 2.2 1.1 4.1 2.8 5.2L12 22l3.2-8.8C16.9 12.1 18 10.2 18 8c0-3.5-2.5-6-6-6z" fill="currentColor" opacity="0.15"/>
          <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="brand__text">DnsNeko</span>
      </a>

      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-switch__btn is-active" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" class="lang-switch__btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <main class="main">
      <div class="card">
        <div class="card__badge" id="badge"></div>

        <h1 class="card__title" id="domain-title"></h1>
        <!-- <p class="card__subtitle" id="subtitle"></p> -->

        <section class="section" id="section-about-page">
          <h2 class="section__title" id="about-page-title"></h2>
          <p class="section__body" id="about-page-body"></p>
        </section>

        <section class="section" id="section-about-dnsneko">
          <h2 class="section__title" id="about-dnsneko-title"></h2>
          <p class="section__body" id="about-dnsneko-body"></p>
        </section>

        <div class="card__actions">
          <a target="_blank" href="https://dnsneko.com" class="btn btn--primary" id="cta-primary" rel="noopener noreferrer">
            <span id="cta-text"></span>
            <svg class="btn__icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd"/>
            </svg>
          </a>
          <a href="mailto:Support@DnsNeko.com" class="btn btn--ghost" id="cta-contact">
            <svg class="btn__icon btn__icon--left" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
            </svg>
            <span id="contact-text"></span>
          </a>
        </div>
      </div>
    </main>

    <footer class="footer">
      <!-- <p class="footer__text" id="footer-text"></p> -->
       <p class="footer__text">©2026 · <a target="_blank" href="https://dnsneko.com" rel="noopener noreferrer">DnsNeko.com</a></p>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
